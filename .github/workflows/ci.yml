name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo; ubuntu runners ship gcc.
      - name: Test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Cross-compile (windows/amd64, linux/amd64)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o /tmp/tunnel-agent-windows-amd64.exe ./cmd/tunnel-agent
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o /tmp/tunnel-agent-linux-amd64 ./cmd/tunnel-agent
